{% extends "base.html" %}

{% block content %}
<section class="panel">
  <div class="panel-heading"><h2 id="planner-title">Plano semanal</h2><input id="planner-week" type="date"></div>

</section>
{% endblock %}
{% block scripts %}<script src="{{ url_for('static', filename='js/weekly_planner.js') }}" defer></script>{% endblock %}
